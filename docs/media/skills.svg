<svg xmlns="http://www.w3.org/2000/svg" width="880" height="386" viewBox="0 0 880 386" role="img" aria-labelledby="t d">
  <title id="t">Three Claude Code skills and the artefacts they left in this repository</title>
  <desc id="d">genjutsu:paint shaped art direction and the design system, checkable in src/lib/palette.check.ts. genjutsu:cast shaped motion, checkable in src/props/chairSpin.ts. design-dna produced the token ramp in src/screens/theme.ts. The result: 349 KB gzip, 79012 triangles, 2 geometry passes per frame, zero downloaded 3D assets, 60 fps at 1440 by 900.</desc>

  <!-- Собственный фон, а не прозрачность: GitHub рендерит README в двух темах,
       и ни один цвет комнаты не проходит 4.5:1 на обеих (bookCloth 7.33/2.58,
       floorOak 3.24/5.85). Непрозрачный ink0 снимает вопрос целиком. -->
  <rect width="880" height="386" rx="4" fill="#0b0e13"/>
  <rect x="0.5" y="0.5" width="879" height="385" rx="4" fill="none" stroke="rgba(255,255,255,.085)"/>

